apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: astronomy-shop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-demo
    targetRevision: "*"
    helm:
      valuesObject:
        # Iteration 1: keep the chart's bundled observability ON to get green fast.
        # Iteration 2: disable these and wire to your own Prometheus/Grafana/Loki.
        # Verify exact keys: helm show values open-telemetry/opentelemetry-demo
        opensearch:
          enabled: false # heaviest bundled component — skip it to fit 2 nodes
        components:
          email:
            imageOverride:
              repository: 361357546722.dkr.ecr.ap-south-1.amazonaws.com/email
              tag: c3793e1a61d136adca6ae89b98b6ea5726ca011b
          image-provider:
            imageOverride:
              repository: 361357546722.dkr.ecr.ap-south-1.amazonaws.com/image-provider
              tag: c3793e1a61d136adca6ae89b98b6ea5726ca011b
  destination:
    server: https://kubernetes.default.svc
    namespace: astronomy-shop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
