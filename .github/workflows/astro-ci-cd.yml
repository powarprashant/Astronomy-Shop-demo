name: Astro CI/CD (build, scan, push to ECR, bump GitOps repo)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
  workflow_dispatch: {}

concurrency:
  group: astro-ci-cd-${{ github.ref }}
  # A new push/dispatch cancels whatever's still running on this ref, instead
  # of queuing behind it - a stuck job (e.g. sonar-scan waiting on an offline
  # self-hosted runner) should never block newer runs from starting.
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 361357546722.dkr.ecr.ap-south-1.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: read

jobs:
  security-scan:
    name: Secret & dependency scan
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect-changes.outputs.services }}
      any-changed: ${{ steps.detect-changes.outputs.any-changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0  # needed by the change-detection step below, which diffs github.event.before
          persist-credentials: false

      # Scans the current tree only (--no-git), not full git history. A
      # manual workflow_dispatch run has no push/PR diff to scope to, so
      # gitleaks-action's default behavior falls back to scanning *all* of
      # history - surfacing years of noise from the original (unrelated)
      # Google microservices-demo project this was forked from, none of it
      # a real/live secret. Scanning the current tree instead is both
      # trigger-independent and actually the more relevant check: is there
      # a live secret in the repo right now. Confirmed false positives for
      # the current tree are in .gitleaksignore. No exit-code override - a
      # detected secret fails this step and blocks every downstream job,
      # unlike the report-only Trivy fs scan.
      - name: Gitleaks secret scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --no-git --source . --no-banner

      - name: Trivy filesystem/dependency scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'  # report-only for now - tighten to '1' once the backlog of existing findings is triaged

      - name: Detect changed services
        id: detect-changes
        run: |
          set -euo pipefail
          cat > /tmp/all-services.json <<'JSON'
          [
            {"service":"accounting","dockerfile":"src/accounting/Dockerfile"},
            {"service":"ad","dockerfile":"src/ad/Dockerfile"},
            {"service":"cart","dockerfile":"src/cart/src/Dockerfile"},
            {"service":"checkout","dockerfile":"src/checkout/Dockerfile"},
            {"service":"currency","dockerfile":"src/currency/Dockerfile"},
            {"service":"email","dockerfile":"src/email/Dockerfile"},
            {"service":"flagd-ui","dockerfile":"src/flagd-ui/Dockerfile"},
            {"service":"fraud-detection","dockerfile":"src/fraud-detection/Dockerfile"},
            {"service":"frontend","dockerfile":"src/frontend/Dockerfile"},
            {"service":"frontend-proxy","dockerfile":"src/frontend-proxy/Dockerfile"},
            {"service":"image-provider","dockerfile":"src/image-provider/Dockerfile"},
            {"service":"kafka","dockerfile":"src/kafka/Dockerfile"},
            {"service":"llm","dockerfile":"src/llm/Dockerfile"},
            {"service":"load-generator","dockerfile":"src/load-generator/Dockerfile"},
            {"service":"payment","dockerfile":"src/payment/Dockerfile"},
            {"service":"product-catalog","dockerfile":"src/product-catalog/Dockerfile"},
            {"service":"product-reviews","dockerfile":"src/product-reviews/Dockerfile"},
            {"service":"quote","dockerfile":"src/quote/Dockerfile"},
            {"service":"recommendation","dockerfile":"src/recommendation/Dockerfile"},
            {"service":"shipping","dockerfile":"src/shipping/Dockerfile"}
          ]
          JSON

          BEFORE="${{ github.event.before }}"
          ZERO_SHA="0000000000000000000000000000000000000000"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO_SHA" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No diffable base commit (manual run or new branch) - building all services"
            jq -c '.' /tmp/all-services.json > /tmp/changed-services.json
          else
            CHANGED_NAMES=()
            while read -r svc; do
              if ! git diff --quiet "$BEFORE" "${{ github.sha }}" -- "src/${svc}/"; then
                CHANGED_NAMES+=("$svc")
              fi
            done < <(jq -r '.[].service' /tmp/all-services.json)

            if [ "${#CHANGED_NAMES[@]}" -eq 0 ]; then
              echo '[]' > /tmp/changed-services.json
            else
              NAMES_JSON=$(printf '%s\n' "${CHANGED_NAMES[@]}" | jq -R . | jq -s .)
              jq -c --argjson names "$NAMES_JSON" '[.[] | select(.service as $s | $names | index($s))]' \
                /tmp/all-services.json > /tmp/changed-services.json
            fi
          fi

          SERVICES_JSON=$(cat /tmp/changed-services.json)
          echo "services=$SERVICES_JSON" >> "$GITHUB_OUTPUT"
          if [ "$SERVICES_JSON" = "[]" ]; then
            echo "any-changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "any-changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed services: $(jq -r '[.[].service] | join(", ")' /tmp/changed-services.json)"

  build-scan-push:
    name: Build, scan, push ${{ matrix.service }}
    needs: security-scan
    if: needs.security-scan.outputs.any-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required to mint the OIDC token for AWS role assumption
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.security-scan.outputs.services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Load environment variables from .env file
        run: |
          if [ -f .env ]; then
            grep -vE '^\s*#|^\s*$' .env | while read -r line; do
              echo "$line" >> $GITHUB_ENV
            done
          else
            echo ".env file not found!"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@b040164c4934333d597f3f9c67502ff28f814e9c  # v2.1.6

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ matrix.service }}" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "${{ matrix.service }}" --region "${{ env.AWS_REGION }}" --image-scanning-configuration scanOnPush=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Build image (loaded locally, not pushed yet)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          build-args: |
            OTEL_JAVA_AGENT_VERSION=${{ env.OTEL_JAVA_AGENT_VERSION }}
            OPENTELEMETRY_CPP_VERSION=${{ env.OPENTELEMETRY_CPP_VERSION }}
            TRACETEST_IMAGE_VERSION=${{ env.TRACETEST_IMAGE_VERSION }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Trivy scan gate
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push image to ECR
        run: docker push "${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}"

  sonar-scan:
    name: SonarQube code quality scan
    # Runs on your self-hosted runner (registered on the same machine as your
    # local SonarQube at localhost:9000) since GitHub-hosted runners can't
    # reach it. Depends only on security-scan (not build-scan-push), so you
    # get quality feedback even if an image build fails.
    needs: security-scan
    runs-on: self-hosted
    timeout-minutes: 20  # bounds a hung scan/container once the runner picks the job up
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0  # SonarQube wants full history for blame/new-code analysis

      - name: Run SonarQube scan
        run: |
          docker run --rm `
            -e SONAR_HOST_URL="${{ secrets.SONAR_HOST_URL }}" `
            -e SONAR_TOKEN="${{ secrets.SONAR_TOKEN }}" `
            -v "${{ github.workspace }}:/usr/src" `
            sonarsource/sonar-scanner-cli `
            -Dsonar.projectKey=astronomy-shop `
            -Dsonar.sources=.

  update-gitops:
    name: Bump image tags in apps/astronomy-shop.yaml
    needs: [security-scan, build-scan-push]
    if: needs.security-scan.outputs.any-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to push the tag-bump commit back to this repo
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: true

      - name: Bump component image tags
        run: |
          set -euo pipefail
          echo '${{ needs.security-scan.outputs.services }}' | jq -r '.[].service' | while read -r svc; do
            yq -i ".spec.source.helm.valuesObject.components.${svc}.imageOverride.repository = \"${{ env.ECR_REGISTRY }}/${svc}\"" apps/astronomy-shop.yaml
            yq -i ".spec.source.helm.valuesObject.components.${svc}.imageOverride.tag = \"${{ env.IMAGE_TAG }}\"" apps/astronomy-shop.yaml
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/astronomy-shop.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Bump astronomy-shop image tags to ${{ env.IMAGE_TAG }}"
          git push
