name: Astro CI/CD (build, scan, push to ECR, bump GitOps repo)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
  workflow_dispatch: {}

concurrency:
  group: astro-ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 361357546722.dkr.ecr.ap-south-1.amazonaws.com
  GITOPS_REPO: powarprashant/astronomy-shop-gitops
  IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: read

jobs:
  build-scan-push:
    name: Build, scan, push ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required to mint the OIDC token for AWS role assumption
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: accounting
            dockerfile: src/accounting/Dockerfile
          - service: ad
            dockerfile: src/ad/Dockerfile
          - service: cart
            dockerfile: src/cart/src/Dockerfile
          - service: checkout
            dockerfile: src/checkout/Dockerfile
          - service: currency
            dockerfile: src/currency/Dockerfile
          - service: email
            dockerfile: src/email/Dockerfile
          - service: flagd-ui
            dockerfile: src/flagd-ui/Dockerfile
          - service: fraud-detection
            dockerfile: src/fraud-detection/Dockerfile
          - service: frontend
            dockerfile: src/frontend/Dockerfile
          - service: frontend-proxy
            dockerfile: src/frontend-proxy/Dockerfile
          - service: image-provider
            dockerfile: src/image-provider/Dockerfile
          - service: kafka
            dockerfile: src/kafka/Dockerfile
          - service: llm
            dockerfile: src/llm/Dockerfile
          - service: load-generator
            dockerfile: src/load-generator/Dockerfile
          - service: payment
            dockerfile: src/payment/Dockerfile
          - service: product-catalog
            dockerfile: src/product-catalog/Dockerfile
          - service: product-reviews
            dockerfile: src/product-reviews/Dockerfile
          - service: quote
            dockerfile: src/quote/Dockerfile
          - service: recommendation
            dockerfile: src/recommendation/Dockerfile
          - service: shipping
            dockerfile: src/shipping/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@b040164c4934333d597f3f9c67502ff28f814e9c # v2.1.6

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ matrix.service }}" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "${{ matrix.service }}" --region "${{ env.AWS_REGION }}" --image-scanning-configuration scanOnPush=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image (loaded locally, not pushed yet)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Trivy scan gate
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push image to ECR
        run: docker push "${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}"

  update-gitops:
    name: Bump image tags in GitOps repo
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          persist-credentials: true

      - name: Bump component image tags
        run: |
          set -euo pipefail
          services="accounting ad cart checkout currency email flagd-ui fraud-detection frontend frontend-proxy image-provider kafka llm load-generator payment product-catalog product-reviews quote recommendation shipping"
          for svc in $services; do
            yq -i ".spec.source.helm.valuesObject.components.${svc}.imageOverride.repository = \"${{ env.ECR_REGISTRY }}/${svc}\"" apps/astronomy-shop.yaml
            yq -i ".spec.source.helm.valuesObject.components.${svc}.imageOverride.tag = \"${{ env.IMAGE_TAG }}\"" apps/astronomy-shop.yaml
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/astronomy-shop.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Bump astronomy-shop image tags to ${{ env.IMAGE_TAG }}"
          git push
